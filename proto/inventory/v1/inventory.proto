syntax = "proto3";

package inventory.v1;

option go_package = "github.com/rammtw/order-management-system/gen/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";

message Product {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  int64 price_cents = 5;
  int32 quantity = 6;
  int32 reserved_quantity = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message GetProductBySKURequest {
  string sku = 1;
}

message GetProductBySKUResponse {
  Product product = 1;
}

message ListProductsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
}

message CreateProductRequest {
  string sku = 1;
  string name = 2;
  string description = 3;
  int64 price_cents = 4;
  int32 quantity = 5;
}

message CreateProductResponse {
  Product product = 1;
}

message UpdateStockRequest {
  string id = 1;
  int32 delta = 2;
}

message UpdateStockResponse {
  Product product = 1;
}

message CheckAvailabilityRequest {
  message Item {
    string product_id = 1;
    int32 quantity = 2;
  }
  repeated Item items = 1;
}

message CheckAvailabilityResponse {
  bool available = 1;
  repeated string unavailable_product_ids = 2;
}

message ReserveStockRequest {
  string order_id = 1;
  message Item {
    string product_id = 1;
    int32 quantity = 2;
  }
  repeated Item items = 2;
}

message ReserveStockResponse {
  bool success = 1;
  repeated string unavailable_product_ids = 2;
}

message ReleaseStockRequest {
  string order_id = 1;
}

message ReleaseStockResponse {}

service InventoryService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc GetProductBySKU(GetProductBySKURequest) returns (GetProductBySKUResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}