version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - prealloc
    - noctx
    - exhaustive
    - bodyclose
    - contextcheck

formatters:
  enable:
    - goimports

linters-settings:
  govet:
    enable-all: true
  goimports:
    local-prefixes: github.com/rammtw/order-management-system

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck